<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szervezeti Ábra (Mobilbarát, Védett & Élő)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--surface2:#f0f2f8;--border:#e2e6f0;
  --text:#1a1d2e;--text2:#5a5f7a;--text3:#9096b5;
  --shadow:0 2px 12px rgba(80,90,160,.10);--shadow-lg:0 8px 32px rgba(80,90,160,.16);
  --accent:#5b5ef4;--toast-bg:#1a1d2e;--toast-fg:#f4f6fa;--toolbar-bg:#fff;
}
[data-theme="dark"]{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--border:#2a2f45;
  --text:#e8ecf8;--text2:#8b92b8;--text3:#4a5070;
  --shadow:0 2px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.55);
  --accent:#818cf8;--toast-bg:#e8ecf8;--toast-fg:#1a1d2e;--toolbar-bg:#181c27;
}
*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;overflow:hidden; touch-action: none;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}

/* Eszköztár */
#toolbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--toolbar-bg);
  border-bottom:1px solid var(--border);padding:7px 14px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:background .3s;
  overflow-x:auto; -webkit-overflow-scrolling:touch;}
#toolbar::-webkit-scrollbar { display: none; }
#toolbar h1{font-size:14px;font-weight:600;color:var(--text);margin-right:auto;white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:8px;}
#toolbar h1 span.title-accent{color:var(--accent)}

.count-badge{background:var(--surface2); color:var(--accent); border:1px solid var(--border);
  padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; font-family:'DM Mono',monospace;}

.tb-btn{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;
  transition:all .15s;white-space:nowrap;flex-shrink:0}
.tb-btn:hover, .tb-btn:active{background:var(--surface);color:var(--text);border-color:var(--accent)}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb-btn.danger{border-color:#ef4444;color:#ef4444}
.tb-btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none}
#save-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;transition:background .3s}
#save-dot.syncing{background:#f59e0b}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}

#stage{position:fixed;top:50px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab; touch-action: none;}
#stage.panning{cursor:grabbing}
#stage svg{width:100%;height:100%;display:block}

#zoom-ctrl{position:fixed;bottom:20px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:50}
.z-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:all .15s}
.z-btn:active{border-color:var(--accent);color:var(--accent)}
#zoom-label{font-size:10px;color:var(--text3);text-align:center;font-family:'DM Mono',monospace}

#empty{position:fixed;top:50px;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;}
#empty .big-icon{font-size:48px;opacity:.3}
#empty p{color:var(--text2);font-size:14px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:10px;
  font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .22s;
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Képernyők & Modalok */
#auth-overlay, #modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
  align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s; padding:16px;}
#auth-overlay.open, #modal-overlay.open{opacity:1;pointer-events:all}

.card-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);
  transform:scale(.95);transition:transform .2s;max-height:90vh;overflow-y:auto}
#auth-overlay.open .card-box, #modal-overlay.open #modal{transform:scale(1)}

.card-box h3{font-size:16px;font-weight:600;margin-bottom:14px;color:var(--text);text-align:center}
.field-group{margin-bottom:12px}
.field-group label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:4px;display:block}
.field-group input[type=text], .field-group input[type=email], .field-group input[type=password]{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;transition:border-color .15s}
.field-group input:focus{border-color:var(--accent)}
.field-group input[type=color]{width:100%;height:38px;padding:2px 3px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface2);cursor:pointer;outline:none}

.checkbox-group{display:flex;align-items:center;gap:10px;margin-top:12px;margin-bottom:14px; background:var(--surface2); padding:10px 12px; border-radius:8px; border:1px solid var(--border);}
.checkbox-group input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
.checkbox-group label{margin-bottom:0;cursor:pointer;user-select:none;font-size:13px;color:var(--text); font-weight:500;}

.modal-section-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;
  letter-spacing:.06em;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
#modal-cancel{background:var(--surface2);color:var(--text2)}
#modal-ok, .btn-auth{background:var(--accent);color:#fff;border-color:var(--accent)}
#auth-error{color:#ef4444;font-size:12px;margin-top:8px;text-align:center;display:none}

.node-actions rect { touch-action: manipulation; }
</style>
</head>
<body>

<!-- Bejelentkezési Képernyő -->
<div id="auth-overlay" class="open">
  <form id="login-form" class="card-box" onsubmit="handleLogin(event)">
    <h3>Bejelentkezés</h3>
    <div class="field-group">
      <label for="auth-email">Email cím</label>
      <input type="email" id="auth-email" name="username" placeholder="nev@domain.com" autocomplete="username" required>
    </div>
    <div class="field-group">
      <label for="auth-password">Jelszó</label>
      <input type="password" id="auth-password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    
    <div class="field-group checkbox-group" style="background:transparent; border:none; padding:0;">
      <input type="checkbox" id="auth-remember" checked>
      <label for="auth-remember" style="color:var(--text2); font-weight:normal;">Bejelentkezési adatok megjegyzése</label>
    </div>

    <div id="auth-error"></div>
    <div class="modal-btns">
      <button type="submit" class="btn-auth">Belépés</button>
    </div>
  </form>
</div>

<!-- Eszköztár -->
<div id="toolbar">
  <h1>
    <span>Szervezeti <span class="title-accent">Ábra</span></span>
    <span id="total-badge" class="count-badge" title="Aktív tagok létszáma">0 fő</span>
  </h1>
  <span id="save-dot" title="Felhő szinkronizáció státusz"></span>
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="openAddModal(null,true)">＋ Gyökér</button>
  <button class="tb-btn" id="btn-child" onclick="addChild()">＋ Alárendelt</button>
  <button class="tb-btn danger" id="btn-del" onclick="deleteSelected()">✕ Törlés</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="fitView()">⊡ Igazítás</button>
  <button class="tb-btn primary" onclick="exportPDF()">⬇ PDF</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
  <button class="tb-btn danger" onclick="handleLogout()" title="Kijelentkezés">🚪 Kilépés</button>
</div>

<div id="stage">
  <svg id="svg-root" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport">
      <g id="edges-layer"></g>
      <g id="nodes-layer"></g>
    </g>
  </svg>
</div>

<div id="empty" style="display: none;">
  <div class="big-icon">🏢</div>
  <p>Még nincs senki a szervezetben.</p>
  <button class="tb-btn primary" style="margin-top:8px" onclick="openAddModal(null,true)">＋ Első személy hozzáadása</button>
</div>

<div id="zoom-ctrl">
  <button class="z-btn" onclick="zoom(1.2)">＋</button>
  <div id="zoom-label">100%</div>
  <button class="z-btn" onclick="zoom(1/1.2)">－</button>
  <button class="z-btn" onclick="fitView()" style="font-size:12px">⊡</button>
</div>

<div id="toast"></div>

<!-- Szerkesztő Modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="card-box">
    <h3 id="modal-title">Személy szerkesztése</h3>
    
    <div class="checkbox-group">
      <input type="checkbox" id="inp-active" checked>
      <label for="inp-active">Aktív tag (beleszámít a struktúrába)</label>
    </div>

    <div class="modal-section-title">Alapadatok</div>
    <div class="field-group"><label>Név</label>
      <input type="text" id="inp-name" placeholder="Pl. Kovács János" autocomplete="off"></div>

    <div class="modal-section-title">Azonosítók</div>
    <div class="field-group"><label>NCC INV:</label>
      <input type="text" id="inp-ncc-inv" placeholder="" autocomplete="off"></div>
    <div class="field-group"><label>NCC ID:</label>
      <input type="text" id="inp-ncc-id" placeholder="" autocomplete="off"></div>
    <div class="field-group"><label>BC ID:</label>
      <input type="text" id="inp-bc-id" placeholder="" autocomplete="off"></div>

    <div class="modal-section-title">Megjelenés</div>
    <div class="field-group"><label>Kártya színe</label>
      <input type="color" id="inp-color" value="#4f46e5"></div>

    <div class="modal-btns">
      <button id="modal-cancel" onclick="closeModal()">Mégse</button>
      <button id="modal-ok" onclick="confirmModal()">Mentés</button>
    </div>
  </div>
</div>

<script>
// ── Firebase Konfiguráció ───────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "IDE_MÁSOLD_AZ_API_KEY-T",
  authDomain: "PROJEKTID.firebaseapp.com",
  databaseURL: "https://PROJEKTID-default-rtdb.firebaseio.com",
  projectId: "PROJEKTID",
  storageBucket: "PROJEKTID.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const orgRef = db.ref('orgData');

let dbListener = null;

document.addEventListener('DOMContentLoaded', () => {
  const savedEmail = localStorage.getItem('remembered_email');
  if (savedEmail) {
    document.getElementById('auth-email').value = savedEmail;
    document.getElementById('auth-remember').checked = true;
  }
});

// ── Hitelesítés (Auth) Kezelése ─────────────────────────────────────────────
auth.onAuthStateChanged((user) => {
  const authOverlay = document.getElementById('auth-overlay');
  if (user) {
    authOverlay.classList.remove('open');
    attachDbListener();
    showToast('✓ Sikeres bejelentkezés');
  } else {
    authOverlay.classList.add('open');
    detachDbListener();
    tree = null;
    render();
  }
});

function handleLogin(e) {
  if (e) e.preventDefault();
  
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const remember = document.getElementById('auth-remember').checked;
  const errDiv = document.getElementById('auth-error');
  errDiv.style.display = 'none';

  if (!email || !password) {
    errDiv.textContent = 'Kérjük, töltsd ki az összes mezőt!';
    errDiv.style.display = 'block';
    return;
  }

  const persistenceType = remember 
    ? firebase.auth.Auth.Persistence.LOCAL 
    : firebase.auth.Auth.Persistence.SESSION;

  auth.setPersistence(persistenceType)
    .then(() => auth.signInWithEmailAndPassword(email, password))
    .then(() => {
      if (remember) localStorage.setItem('remembered_email', email);
      else localStorage.removeItem('remembered_email');
    })
    .catch((error) => {
      errDiv.textContent = 'Hibás email cím vagy jelszó!';
      errDiv.style.display = 'block';
    });
}

function handleLogout() { auth.signOut(); }

// ── Realtime Szinkronizáció ────────────────────────────────────────────────
function saveToCloud() {
  if (!auth.currentUser) return;
  document.getElementById('save-dot').classList.add('syncing');
  orgRef.set({ tree: tree || null, nextId }, (error) => {
    document.getElementById('save-dot').classList.remove('syncing');
    if (error) showToast('❌ Hiba a felhőbe mentéskor');
  });
}

function attachDbListener() {
  if (dbListener) return;
  dbListener = orgRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      tree = data.tree || null;
      nextId = data.nextId || 100;
      if (tree) fixDepths(tree, 0);
    } else {
      tree = null;
    }
    render();
    requestAnimationFrame(fitView);
  });
}

function detachDbListener() {
  if (dbListener) {
    orgRef.off('value', dbListener);
    dbListener = null;
  }
}

// ── Konstansok & Állapot ─────────────────────────────────────────────────────
const NODE_W = 190, H_GAP = 20, V_GAP = 60;
const DEFAULT_COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];

let tree = null, nextId = 1, selectedId = null;
let modalMode = null, modalParentId = null, editingId = null;
let vx = 0, vy = 0, vscale = 1;

// ── Fa & Számláló Segédfüggvények ──────────────────────────────────────────
function makeNode(name, role, nccInv, nccId, bcId, color, active = true) {
  return { id: nextId++, name, role,
    nccInv: nccInv||'', nccId: nccId||'', bcId: bcId||'',
    color: color || DEFAULT_COLORS[0],
    active: active !== false,
    depth: 0, children: [] };
}

function countActiveSubtree(node) {
  if (!node) return 0;
  let count = (node.active !== false) ? 1 : 0;
  if (node.children && node.children.length) {
    for (const child of node.children) {
      count += countActiveSubtree(child);
    }
  }
  return count;
}

function findNode(node, id) {
  if (!node) return null;
  if (node.id === id) return node;
  for (const c of (node.children || [])) { const f = findNode(c, id); if (f) return f; }
  return null;
}
function deleteNodeById(node, id) {
  if (!node) return;
  node.children = (node.children || []).filter(c => c.id !== id);
  node.children.forEach(c => deleteNodeById(c, id));
}
function fixDepths(node, d) {
  if (!node) return;
  node.depth = d;
  if (node.active === undefined) node.active = true;
  if (!node.children) node.children = [];
  if (!node.color) node.color = DEFAULT_COLORS[Math.min(d, DEFAULT_COLORS.length-1)];
  node.children.forEach(c => fixDepths(c, d + 1));
}
function allNodes(node, arr = []) {
  if (!node) return arr;
  arr.push(node);
  (node.children || []).forEach(c => allNodes(c, arr));
  return arr;
}

// ── Elrendezés ──────────────────────────────────────────────────────────────
function subtreeWidth(node) {
  if (!node.children || !node.children.length) return NODE_W;
  const cw = node.children.reduce((s,c) => s + subtreeWidth(c), 0) + H_GAP*(node.children.length-1);
  return Math.max(NODE_W, cw);
}
function assignXY(node, x, y) {
  const sw = subtreeWidth(node);
  node._x = x + sw/2 - NODE_W/2;
  node._y = y;
  let cx = x;
  for (const c of (node.children || [])) {
    assignXY(c, cx, y + 100 + V_GAP);
    cx += subtreeWidth(c) + H_GAP;
  }
}
function computeLayout() { if (tree) assignXY(tree, 0, 0); }

// ── Renderelés ──────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function lighten(hex, amt=55) {
  const [r,g,b] = hexToRgb(hex);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

function render() {
  const empty = document.getElementById('empty');
  const edgesL = document.getElementById('edges-layer');
  const nodesL = document.getElementById('nodes-layer');
  document.getElementById('btn-child').disabled = !selectedId;
  document.getElementById('btn-del').disabled = !selectedId;

  // Fejléc számláló frissítése
  const totalActive = countActiveSubtree(tree);
  document.getElementById('total-badge').textContent = `${totalActive} fő`;

  if (!tree) {
    edgesL.innerHTML = ''; nodesL.innerHTML = '';
    empty.style.display = 'flex'; return;
  }
  empty.style.display = 'none';
  computeLayout();
  const nodes = allNodes(tree);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const connColor = isDark ? '#2e3655' : '#d1d9ee';

  let eHTML = '';
  function drawEdges(n) {
    (n.children || []).forEach(c => {
      const x1=n._x+NODE_W/2, y1=n._y+99, x2=c._x+NODE_W/2, y2=c._y, my=(y1+y2)/2;
      const strokeDash = (n.active === false || c.active === false) ? 'stroke-dasharray="4 4" opacity="0.4"' : '';
      eHTML += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="${connColor}" stroke-width="1.5" stroke-linecap="round" ${strokeDash}/>`;
      drawEdges(c);
    });
  }
  drawEdges(tree);
  edgesL.innerHTML = eHTML;

  let nHTML = '';
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  nodes.forEach(node => {
    const isActive = node.active !== false;
    const bg = isActive 
      ? (node.color || DEFAULT_COLORS[Math.min(node.depth, DEFAULT_COLORS.length-1)])
      : '#4a5068'; // Inaktív kártya szürkésebb háttér
    
    const avatarLight = lighten(bg, 40);
    const ini = initials(node.name);
    const sel = selectedId === node.id;
    const selStroke = sel ? `stroke="#fff" stroke-width="2.5"` : '';

    const idRows = [
      { label: 'NCC INV:', val: node.nccInv },
      { label: 'NCC ID:',  val: node.nccId  },
      { label: 'BC ID:',   val: node.bcId   },
    ].filter(r => r.val);

    const hasIds = idRows.length > 0;
    let cardH = hasIds ? 38 + 6 + idRows.length * 15 + 10 : 44;
    
    // Alatta lévők számlálója ha ki van jelölve a tag
    const subCount = countActiveSubtree(node);
    const nodeOpacity = isActive ? "1" : "0.55";
    const actionOpacity = isTouchDevice ? "1" : "0";

    nHTML += `
    <g transform="translate(${node._x},${node._y})" class="node-g" data-id="${node.id}" onclick="selectNode(${node.id})" opacity="${nodeOpacity}">
      <rect x="0" y="0" width="${NODE_W}" height="${cardH}" rx="11" fill="${bg}" ${selStroke} style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.22));cursor:pointer"/>
      
      <!-- Avatar -->
      <circle cx="24" cy="22" r="14" fill="${avatarLight}" opacity=".38"/>
      <text x="24" y="22" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="10" font-weight="600" font-family="DM Mono,monospace" style="pointer-events:none">${esc(ini)}</text>
      
      <!-- Név / Inaktív tag -->
      <foreignObject x="46" y="2" width="136" height="22">
        <input xmlns="http://www.w3.org/1999/xhtml" class="svg-name" value="${esc(node.name)}"
          style="width:100%;background:transparent;border:none;outline:none;color:#fff;font-family:DM Sans,sans-serif;font-size:12px;font-weight:600;padding:0;line-height:1;cursor:text"
          onchange="onFieldInput(${node.id},'name',this.value)" onclick="event.stopPropagation()" placeholder="Név"/>
      </foreignObject>

      ${!isActive ? `<text x="46" y="32" fill="#f87171" font-size="8" font-weight="700" font-family="DM Sans,sans-serif" style="pointer-events:none">INAKTÍV</text>` : ''}

      ${hasIds ? `
      <line x1="10" y1="38" x2="180" y2="38" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      ${idRows.map((row, i) => `
        <text x="12" y="${51 + i * 15}" fill="rgba(255,255,255,.5)" font-size="8.5" font-family="DM Sans,sans-serif" style="pointer-events:none">${esc(row.label)}</text>
        <text x="100" y="${51 + i * 15}" fill="rgba(255,255,255,.92)" font-size="8.5" font-family="DM Mono,monospace" font-weight="500" style="pointer-events:none">${esc(row.val)}</text>
      `).join('')}` : ''}

      <!-- Kiválasztott tag alatti létszám jelvény (Pill Badge) -->
      ${sel ? `
      <g transform="translate(${NODE_W/2 - 45}, ${cardH + 8})">
        <rect x="0" y="0" width="90" height="22" rx="11" fill="var(--accent)" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));"/>
        <text x="45" y="11" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="10" font-weight="700" font-family="DM Sans,sans-serif">👥 ${subCount} fő</text>
      </g>
      ` : ''}

      <g class="node-actions" opacity="${actionOpacity}">
        <rect x="136" y="2" width="24" height="24" rx="6" fill="rgba(255,255,255,.25)" style="cursor:pointer;" onclick="event.stopPropagation();openEditModal(${node.id})"/>
        <text x="148" y="14" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12" style="pointer-events:none">✎</text>
        <rect x="164" y="2" width="24" height="24" rx="6" fill="rgba(255,255,255,.25)" style="cursor:pointer;" onclick="event.stopPropagation();addChildTo(${node.id})"/>
        <text x="176" y="14" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" style="pointer-events:none">＋</text>
      </g>
    </g>`;
  });
  nodesL.innerHTML = nHTML;

  if (!isTouchDevice) {
    document.querySelectorAll('.node-g').forEach(g => {
      const acts = g.querySelector('.node-actions');
      g.addEventListener('mouseenter', () => { acts.setAttribute('opacity','1'); });
      g.addEventListener('mouseleave', () => { acts.setAttribute('opacity','0'); });
    });
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(name) { return String(name||'').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'; }

function onFieldInput(id, field, val) {
  const n = findNode(tree, id);
  if (!n) return;
  n[field] = val;
  saveToCloud();
}

// ── Egér & Érintésvezérlés ──────────────────────────────────────────────────
function applyTransform() {
  document.getElementById('viewport').setAttribute('transform',`translate(${vx},${vy}) scale(${vscale})`);
  document.getElementById('zoom-label').textContent = Math.round(vscale*100)+'%';
}

function zoom(factor, cx, cy) {
  const stage = document.getElementById('stage');
  const r = stage.getBoundingClientRect();
  const px = cx ?? r.width/2, py = cy ?? r.height/2;
  const ns = Math.min(4, Math.max(0.08, vscale*factor));
  vx = px-(px-vx)*(ns/vscale); vy = py-(py-vy)*(ns/vscale); vscale = ns;
  applyTransform();
}

function fitView() {
  if (!tree) return;
  computeLayout();
  const nodes = allNodes(tree);
  if (!nodes.length) return;
  const xs = nodes.map(n=>n._x), ys = nodes.map(n=>n._y);
  const minX=Math.min(...xs), minY=Math.min(...ys);
  const maxX=Math.max(...xs)+NODE_W, maxY=Math.max(...ys)+100;
  const tw=maxX-minX, th=maxY-minY;
  const stage=document.getElementById('stage');
  const sw=stage.clientWidth, sh=stage.clientHeight, pad=32;
  const scale=Math.min((sw-pad*2)/tw,(sh-pad*2)/th,1.2);
  vscale=scale; vx=(sw-tw*scale)/2-minX*scale; vy=(sh-th*scale)/2-minY*scale;
  applyTransform();
}

const stage = document.getElementById('stage');
let isPanning = false, panStart = {x:0, y:0}, panOrigin = {x:0, y:0};
let touchStartDist = 0, initialScale = 1;

stage.addEventListener('mousedown', e => {
  if (e.target.closest('.node-g')||e.target.closest('input')) return;
  isPanning=true; panStart={x:e.clientX,y:e.clientY}; panOrigin={x:vx,y:vy};
  stage.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  vx=panOrigin.x+(e.clientX-panStart.x); vy=panOrigin.y+(e.clientY-panStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isPanning=false; stage.classList.remove('panning'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoom(e.deltaY<0?1.1:0.9, e.clientX-r.left, e.clientY-r.top);
}, {passive:false});

stage.addEventListener('touchstart', e => {
  if (e.target.closest('input') || e.target.closest('.modal-btns')) return;
  if (e.touches.length === 1) {
    isPanning = true;
    panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    panOrigin = { x: vx, y: vy };
  } else if (e.touches.length === 2) {
    isPanning = false;
    touchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    initialScale = vscale;
  }
}, {passive: true});

stage.addEventListener('touchmove', e => {
  if (isPanning && e.touches.length === 1) {
    vx = panOrigin.x + (e.touches[0].clientX - panStart.x);
    vy = panOrigin.y + (e.touches[0].clientY - panStart.y);
    applyTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (touchStartDist > 0) {
      const factor = dist / touchStartDist;
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - 50;
      const ns = Math.min(4, Math.max(0.08, initialScale * factor));
      vx = midX - (midX - vx) * (ns / vscale);
      vy = midY - (midY - vy) * (ns / vscale);
      vscale = ns;
      applyTransform();
    }
  }
}, {passive: true});

stage.addEventListener('touchend', () => { isPanning = false; touchStartDist = 0; });
window.addEventListener('resize', () => { if(tree) fitView(); });

// ── Csomópont Műveletek ─────────────────────────────────────────────────────
function selectNode(id) { selectedId=(selectedId===id)?null:id; render(); applyTransform(); }
function addChild() { if (selectedId) openAddModal(selectedId); }
function addChildTo(id) { openAddModal(id); }
function deleteSelected() {
  if (!selectedId||!tree) return;
  if (tree.id===selectedId) tree=null; else deleteNodeById(tree,selectedId);
  selectedId=null; saveToCloud();
}

// ── Modal kezelés ───────────────────────────────────────────────────────────
function fillModal(node) {
  document.getElementById('inp-active').checked  = node ? (node.active !== false) : true;
  document.getElementById('inp-name').value    = node ? node.name    : '';
  document.getElementById('inp-ncc-inv').value = node ? node.nccInv : '';
  document.getElementById('inp-ncc-id').value  = node ? node.nccId  : '';
  document.getElementById('inp-bc-id').value   = node ? node.bcId   : '';
  document.getElementById('inp-color').value   = node ? (node.color||'#4f46e5') : '#4f46e5';
}

function openAddModal(parentId, isRoot=false) {
  modalMode = isRoot ? 'root' : 'child';
  modalParentId = parentId; editingId = null;
  document.getElementById('modal-title').textContent = isRoot ? 'Gyökér személy' : 'Alárendelt hozzáadása';
  let depth = 0;
  if (!isRoot && parentId) { const p = findNode(tree, parentId); if (p) depth = p.depth + 1; }
  fillModal(null);
  document.getElementById('inp-color').value = DEFAULT_COLORS[Math.min(depth, DEFAULT_COLORS.length-1)];
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-name').focus(),100);
}

function openEditModal(id) {
  const node = findNode(tree, id); if (!node) return;
  modalMode = 'edit'; editingId = id;
  document.getElementById('modal-title').textContent = 'Személy szerkesztése';
  fillModal(node);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-name').focus(),100);
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function confirmModal() {
  const active  = document.getElementById('inp-active').checked;
  const name    = document.getElementById('inp-name').value.trim()    || 'Névtelen';
  const nccInv  = document.getElementById('inp-ncc-inv').value.trim();
  const nccId   = document.getElementById('inp-ncc-id').value.trim();
  const bcId    = document.getElementById('inp-bc-id').value.trim();
  const color   = document.getElementById('inp-color').value;

  if (modalMode === 'edit') {
    const node = findNode(tree, editingId);
    if (node) { node.active=active; node.name=name; node.nccInv=nccInv; node.nccId=nccId; node.bcId=bcId; node.color=color; }
  } else if (modalMode === 'root') {
    tree = makeNode(name,'',nccInv,nccId,bcId,color, active); tree.depth=0; selectedId=null;
  } else {
    const parent = findNode(tree, modalParentId);
    if (parent) {
      if (!parent.children) parent.children = [];
      const child = makeNode(name,'',nccInv,nccId,bcId,color, active);
      child.depth = parent.depth+1;
      parent.children.push(child);
    }
  }
  closeModal();
  saveToCloud();
}

// ── Téma & Toast ─────────────────────────────────────────────────────────────
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('theme-btn').textContent = next==='dark'?'☀️':'🌙';
  render(); applyTransform();
}
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ── Szépített PDF Export ────────────────────────────────────────────────────
function exportPDF() {
  if (!tree) { showToast('Nincs adat'); return; }
  showToast('⏳ PDF készítése...');
  computeLayout();
  const nodes = allNodes(tree);
  
  const minX = Math.min(...nodes.map(n=>n._x));
  const minY = Math.min(...nodes.map(n=>n._y));
  const maxX = Math.max(...nodes.map(n=>n._x)) + NODE_W;
  const maxY = Math.max(...nodes.map(n=>n._y)) + 120;
  const treeW = maxX - minX, treeH = maxY - minY;

  const { jsPDF } = window.jspdf;
  const isLandscape = treeW > treeH;
  const pdf = new jsPDF({ orientation: isLandscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
  
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  // Fejléc ÉS Háttér sáv
  pdf.setFillColor(15, 17, 23);
  pdf.rect(0, 0, pageW, pageH, 'F');

  // Címke és Dátum Fejléc
  pdf.setFillColor(24, 28, 39);
  pdf.rect(0, 0, pageW, 16, 'F');
  
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(12);
  pdf.setTextColor(255, 255, 255);
  pdf.text('SZERVEZETI ÁBRA', 12, 10.5);

  const totalActiveCount = countActiveSubtree(tree);
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(9);
  pdf.setTextColor(129, 140, 248);
  pdf.text(`Összesen: ${totalActiveCount} aktív fő`, 70, 10.5);

  const dateStr = new Date().toLocaleDateString('hu-HU');
  pdf.setTextColor(140, 146, 176);
  pdf.text(`Generálva: ${dateStr}`, pageW - 12, 10.5, { align: 'right' });

  // Méretezés a lapra
  const padding = 15;
  const topMargin = 22;
  const availW = pageW - (padding * 2);
  const availH = pageH - topMargin - padding;
  
  const scale = Math.min(availW / treeW, availH / treeH, 0.85);
  const offX = padding + (availW - treeW * scale) / 2 - minX * scale;
  const offY = topMargin + (availH - treeH * scale) / 2 - minY * scale;

  // Kapcsoló vonalak rajzolása
  pdf.setLineWidth(0.3);
  nodes.forEach(node => {
    (node.children || []).forEach(child => {
      const x1 = offX + (node._x + NODE_W / 2) * scale;
      const y1 = offY + (node._y + 44) * scale;
      const x2 = offX + (child._x + NODE_W / 2) * scale;
      const y2 = offY + child._y * scale;
      const midY = (y1 + y2) / 2;

      pdf.setDrawColor(60, 68, 95);
      pdf.line(x1, y1, x1, midY);
      pdf.line(x1, midY, x2, midY);
      pdf.line(x2, midY, x2, y2);
    });
  });

  // Kártyák kirajzolása
  nodes.forEach(node => {
    const isActive = node.active !== false;
    const px = offX + node._x * scale;
    const py = offY + node._y * scale;
    const idRows = [
      { label: 'NCC INV:', val: node.nccInv },
      { label: 'NCC ID:',  val: node.nccId  },
      { label: 'BC ID:',   val: node.bcId   }
    ].filter(r => r.val);

    const cardH_PX = idRows.length > 0 ? 38 + 6 + idRows.length * 15 + 10 : 44;
    const w = NODE_W * scale;
    const h = cardH_PX * scale;

    const rgb = isActive ? hexToRgb(node.color || '#4f46e5') : [74, 80, 104];

    // Kártya háttér lekererekítve
    pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
    pdf.roundedRect(px, py, w, h, 2, 2, 'F');

    // Név
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(Math.max(6, 9 * scale));
    pdf.setTextColor(255, 255, 255);
    pdf.text(node.name || 'Névtelen', px + 6 * scale, py + 12 * scale);

    if (!isActive) {
      pdf.setFontSize(Math.max(4, 6 * scale));
      pdf.setTextColor(248, 113, 113);
      pdf.text('INAKTÍV', px + 6 * scale, py + 18 * scale);
    }

    // Azonosítók
    if (idRows.length > 0) {
      pdf.setDrawColor(255, 255, 255);
      pdf.setLineWidth(0.1);
      pdf.line(px + 4 * scale, py + 22 * scale, px + w - 4 * scale, py + 22 * scale);

      idRows.forEach((row, idx) => {
        const rowY = py + (30 + idx * 10) * scale;
        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(Math.max(4, 6.5 * scale));
        pdf.setTextColor(200, 205, 225);
        pdf.text(row.label, px + 6 * scale, rowY);

        pdf.setFont('courier', 'bold');
        pdf.setTextColor(255, 255, 255);
        pdf.text(row.val, px + 35 * scale, rowY);
      });
    }
  });

  pdf.save('Szervezeti_Abra.pdf');
  showToast('✓ PDF letöltve');
}

// ── Billentyűk ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const inModal = document.getElementById('modal-overlay').classList.contains('open');
  if (e.key==='Enter'&&inModal) confirmModal();
  if (e.key==='Escape') { if (inModal) closeModal(); else { selectedId=null; render(); applyTransform(); } }
});
</script>
